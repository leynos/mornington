name: Coverage (main)

# This workflow is the repository's only CodeScene caller. CodeScene
# accepts `cs-coverage upload` only for analysed branches, so main-branch
# coverage is uploaded here; pull requests generate coverage in ci.yml for
# their own ratchet and never receive the token or contact CodeScene. This
# workflow also advances the coverage ratchet baseline: caches saved on main
# are readable by every pull-request run, so the baseline written here is the
# one a pull request's ratchet compares against.
#
# workflow_dispatch is mandatory, not a convenience: merges performed by
# the automerge workflow's GITHUB_TOKEN do not fire push-event workflows,
# so automerged changes to main only receive coverage when this workflow
# is dispatched from main. The token is an environment secret of the
# main-only `codescene` environment, which the job declares.

'on':
  push:
    branches: [main]
  workflow_dispatch:

# Publishers queue rather than race or cancel. Runs in the group never
# overlap, and a newer trigger replaces an older pending run; nothing here
# promises that runs start in commit order. The coverage action saves the
# ratchet baseline only on a push, so a dispatch uploads coverage but leaves
# the baseline where the last completed push left it.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # CS_ACCESS_TOKEN is a secret of this environment, which admits main
    # alone, so no other ref can reach the token.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
        with:
          rustflags: -Zpolonius=next
      - name: Log Rust compiler configuration
        run: |-
          rustc --version
          printf 'Base RUSTFLAGS: %s\n' "$RUSTFLAGS"
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # mold accelerates dev builds; coverage uses lld for llvm-tools compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install test runner
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -Zpolonius=next -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -Zpolonius=next -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # Publishes whether the token exists, and nothing else. The token is in
      # no `env` on this workflow: the upload is a composite action whose
      # nested steps inherit the calling step's `env`. GitHub evaluates the
      # expression before it sends the command to the runner, so this shell
      # receives only `true` or `false`; the upload alone receives the token,
      # as its input.
      - name: Check CodeScene token availability
        id: codescene_token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # The ref guard is not redundant with the push branch filter: a
      # dispatch runs from whichever branch started it, and the upload action
      # does not check the ref itself.
      - name: Upload coverage data to CodeScene
        if: steps.codescene_token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        # No checksum input: the uploader pins cs-coverage through its own
        # manifest and rejects a non-empty `installer-checksum`.
        with:
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}


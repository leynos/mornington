
name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          install-mold: 'true'
          rustflags: -Zpolonius=next
          use-sccache: "${{ env.ACT != 'true' }}"
      - name: Log Rust compiler configuration
        run: |-
          rustc --version
          printf 'Base RUSTFLAGS: %s\n' "$RUSTFLAGS"
      - name: Install clang and lld
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # setup-rust provides the configured linker (install-mold above); coverage uses lld
          # compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          version: '0.6.1'
      - name: Check build prerequisites
        run: make check-build-tools
      - name: Setup uv
        uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@2df9e28eb87988518ef3880c34edad45d65b1668
        with:
          globs: '**/*.md'
      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Check spelling
        run: make spelling
      - name: Install test runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      # Dependency audits report advisories against the whole lockfile, so a
      # newly published advisory would fail every Dependabot PR regardless of
      # content and deadlock auto-merge. The scheduled audit workflow covers
      # Dependabot merges instead.
      - name: Install cargo-audit
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm cargo-audit
      - name: Setup Python for audit manifest extraction
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          cranelift: 'true'
      - name: Audit dependencies
        if: github.actor != 'dependabot[bot]'
        run: make audit
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Log coverage linker configuration
        if: env.ACT != 'true'
        run: |
          echo "Coverage linker: clang"
          echo "Coverage codegen backend: llvm"
          echo "Coverage RUSTFLAGS: -Zpolonius=next -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Test in Act
        if: env.ACT == 'true'
        run: make test
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request' && env.ACT != 'true'
        uses: leynos/shared-actions/.github/actions/generate-coverage@872f59f53717b5bebe8e24b2f4a7496b089a939a
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
          RUSTFLAGS: -Zpolonius=next -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          language: rust
          cargo-manifest: Cargo.toml
          all-targets: 'true'
          all-features: 'true'
          doctests: 'true'
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # The publisher in coverage-main.yml owns the coverage artefact and
          # the ratchet baseline; this lane only compares against it.
          publish-artefact: 'false'
